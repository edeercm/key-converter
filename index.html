<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Claves Criptográficas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">🔐 Convertidor de Claves</h1>
            <p class="text-blue-200">Conversión segura client-side - Nada se envía a servidores</p>
        </div>

        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20">
            
            <div class="mb-8">
                <h2 class="text-2xl font-semibold text-white mb-4 flex items-center">
                    <span class="bg-blue-500 rounded-full w-8 h-8 flex items-center justify-center text-sm mr-3">1</span>
                    Key
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-blue-200 mb-2 font-medium">Ingresa tu Key:</label>
                        <input 
                            type="text" 
                            id="uuidInput" 
                            placeholder="8d536241-35w5-4216-8085-39a8d3cwa9be"
                            class="w-full px-4 py-3 bg-white/5 border border-blue-400/30 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        />
                        <p id="uuidError" class="hidden text-red-400 text-sm mt-2 flex items-center animate-pulse">
                            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span>Campo requerido</span>
                        </p>
                    </div>
                    
                    <button 
                        id="btnConvertUUID"
                        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-lg hover:shadow-xl transform hover:scale-[1.02]">
                        Generar Hash SHA-256 (AES Key)
                    </button>
                    
                    <div id="aesResult" class="hidden">
                        <label class="block text-green-300 mb-2 font-medium">Resultado (64 hex):</label>
                        <div class="bg-gray-900/50 rounded-lg p-4 border border-green-500/30">
                            <code id="aesOutput" class="text-green-400 break-all text-sm"></code>
                        </div>
                        <button 
                            id="btnCopyAES"
                            class="mt-2 text-blue-300 hover:text-blue-100 text-sm flex items-center transition-colors">
                            📋 Copiar al portapapeles
                        </button>
                    </div>
                </div>
            </div>

            <div class="border-t border-white/20 my-8"></div>

            <div>
                <h2 class="text-2xl font-semibold text-white mb-4 flex items-center">
                    <span class="bg-purple-500 rounded-full w-8 h-8 flex items-center justify-center text-sm mr-3">2</span>
                    Shared Secret
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-blue-200 mb-2 font-medium">Ingresa tu Shared Secret:</label>
                        <input 
                            type="text" 
                            id="base64Input" 
                            placeholder="eHL4CvENDChAOqiVskT0r6uS3XKY/RCEi6XE8SzlBic="
                            class="w-full px-4 py-3 bg-white/5 border border-purple-400/30 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                        />
                        <p id="base64Error" class="hidden text-red-400 text-sm mt-2 flex items-center animate-pulse">
                            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span>Campo requerido</span>
                        </p>
                    </div>
                    
                    <button 
                        id="btnConvertBase64"
                        class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-lg hover:shadow-xl transform hover:scale-[1.02]">
                        Generar Hash SHA-256 (HMAC Key)
                    </button>
                    
                    <div id="hmacResult" class="hidden">
                        <label class="block text-green-300 mb-2 font-medium">Resultado (64 hex):</label>
                        <div class="bg-gray-900/50 rounded-lg p-4 border border-green-500/30">
                            <code id="hmacOutput" class="text-green-400 break-all text-sm"></code>
                        </div>
                        <button 
                            id="btnCopyHMAC"
                            class="mt-2 text-purple-300 hover:text-purple-100 text-sm flex items-center transition-colors">
                            📋 Copiar al portapapeles
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 text-center text-blue-300 text-sm">
            <p>🔒 Todas las operaciones son realizadas localmente en tu navegador</p>
            <p class="mt-2 text-blue-400/60">No se almacena ni transmite ninguna información</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
